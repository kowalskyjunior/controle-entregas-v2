<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Controle Entregas</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">CE</div>
    <div class="topbar-copy">
      <span id="dateLabel" class="eyebrow"></span>
      <h1 id="pageTitle">Início</h1>
    </div>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" aria-label="Buscar"> </button>
      <button id="filterBtn" class="icon-btn" aria-label="Filtros"> </button>
      <button id="themeBtn" class="icon-btn" aria-label="Alternar tema"> </button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-nav="home" class="nav-item active"><span class="nav-icon" data-icon="home"></span><span>Início</span></button>
    <button data-nav="deliveries" class="nav-item"><span class="nav-icon" data-icon="bag"></span><span>Vendas</span></button>
    <button data-nav="products" class="nav-item"><span class="nav-icon" data-icon="box"></span><span>Produtos</span></button>
    <button data-nav="customers" class="nav-item"><span class="nav-icon" data-icon="user"></span><span>Clientes</span></button>
    <button data-nav="reports" class="nav-item"><span class="nav-icon" data-icon="chart"></span><span>Resumo</span></button>
  </nav>
  <button id="fab" class="primary-action"><span data-icon="plus"></span><b>Nova entrega</b></button>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
</div>
<script src="app.js"></script>
</body>
</html>
